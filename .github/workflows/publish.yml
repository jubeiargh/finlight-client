name: Publish to npm and JSR

# Publishing happens only here, from a clean checkout of the release tag.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      npm-tag: ${{ steps.tag.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tag equals package.json version
        run: node scripts/sync-version.js --check --tag "${{ github.ref_name }}"
      - name: Choose the npm dist-tag
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then echo "npm-tag=next" >> "$GITHUB_OUTPUT"; else echo "npm-tag=latest" >> "$GITHUB_OUTPUT"; fi
      - run: npm run conformance:check
      - run: npm test
      - run: npm run build
      - run: npm run pack:check

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public --tag ${{ needs.verify.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Publish to JSR (OIDC, no token)
        run: npx -y jsr publish
